name: Cập nhật kết quả xổ số

on:
  schedule:
    # Giờ UTC (VN = UTC+7): 16:35, 17:35, 18:35 theo giờ VN, thêm lượt 19:05 phòng chậm
    - cron: '35 9,10,11 * * *'
    - cron: '5 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.js
      - name: Commit nếu có thay đổi
        run: |
          if [ -n "$(git status --porcelain data/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "Cập nhật kết quả xổ số"
            git push
          fi
